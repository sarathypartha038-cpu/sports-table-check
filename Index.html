<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Table Check Tools</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:0;
}

.container{
    max-width:1000px;
    margin:40px auto;
    text-align:center;
}

h1{
    color:#004a99;
    margin-bottom:30px;
}

.card{
    background:#fff;
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.sport{
    font-size:24px;
    font-weight:bold;
    color:#004a99;
    margin-bottom:15px;
}

.country{
    font-size:18px;
    font-weight:bold;
    margin-top:15px;
    color:#333;
}

.comp{
    display:block;
    width:350px;
    margin:10px auto;
    padding:15px;
    background:#0074e8;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
    font-size:16px;
    transition:.2s;
}

.comp:hover{
    background:#005bbd;
}
</style>
</head>

<body>

<div class="container">

<h1>Sports Table Check Tools</h1>

<div class="card">

<div class="sport">🏉 Rugby</div>

<div class="country">Australia</div>

<a class="comp" href="nrl_table_check.html">
    National Rugby League
</a>

</div>

</div>

</body>
</html>
